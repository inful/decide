name: Release

on:
  push:
    # GoReleaser ships tags that match vX.Y.Z or vX.Y.Z-rcN.
    tags: ['v*.*.*']

# Write releases: create the GitHub release. The default GITHUB_TOKEN has
# sufficient scope for a draft release against the same repo.
permissions:
  contents: write

# Don't run more than one release at a time for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA so a moved tag cannot change
      # what runs here. The version goes in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so GoReleaser can compute the changelog between
          # the previous and current tags.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # No module cache: this package has no dependencies, so there is
          # no go.sum for setup-go to hash and the cache never restores
          # anything.

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          # Pinned so the same tag always produces the same release.
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}